project:
  type: book
  output-dir: build

lang: nl

book:
  title: "Cyberboswachters"
  author: "Tim Dams"
  navbar:
    background: light
    pinned: true
    left:
      - text: "Slides"
        href: slides/overzicht.qmd
      - text: "Slides (EN)"
        href: slides/en/index.qmd
      - text: "PDF"
        icon: file-pdf
        href: Cyberboswachters.pdf
  chapters:
    - index.qmd
    - content/0_het_security_landschap/les1_wordtheterger.md
    - content/0_het_security_landschap/2_basicsec.md
    - content/1_cryptografie/basics.md
    - content/3_netwerk_security/wifi.md
    - content/1_cryptografie/authenticatie.md
    - content/5_iot/iotintro.md
  appendices:
    - content/0_het_security_landschap/3_gdpr.md
    - content/appendix/darkweb.md
    - content/appendix/awareness.md
    - content/appendix/meerweten.md
    - content/appendix/bronnen.md
    - slides/overzicht.qmd
    - slides/en/index.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, brand, custom.scss]
    toc: true
    toc-title: "Op deze pagina"
    lightbox: true
    number-sections: false
    highlight-style: github
    code-copy: true
    grid:
      sidebar-width: 290px
      body-width: 820px
      margin-width: 240px
      gutter-width: 1.5rem
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  typst:
    mainfont: "Arial"
    papersize: a4
    section-numbering: "1.1"
    margin:
      x: 2.5cm
      y: 3cm
