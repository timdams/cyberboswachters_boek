name: Build and Publish Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto book
        run: quarto render cyberboswachters/

      - name: Render slides
        run: quarto render cyberboswachters/slides/

      - name: Restore cached slide PDFs
        uses: actions/cache@v4
        with:
          path: cached-slide-pdfs
          key: slide-pdfs-${{ github.sha }}
          restore-keys: |
            slide-pdfs-

      - name: Convert changed slides to PDF
        run: |
          # Restore cached PDFs into build dir, preserving subfolder structure
          if [ -d cached-slide-pdfs ]; then
            rsync -a cached-slide-pdfs/ cyberboswachters/build/slides/ 2>/dev/null || true
          fi

          # Determine diff base: prefer the pre-push SHA, fall back to HEAD~1
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          echo "Diff base: ${BASE:-<none, rebuilding all>}"

          # Check if global slide config changed → rebuild all PDFs
          REBUILD_ALL=false
          if [ -z "$BASE" ]; then
            REBUILD_ALL=true
          elif git diff --name-only "$BASE" HEAD | grep -qE 'cyberboswachters/slides/(_quarto\.yml|_extensions/)'; then
            REBUILD_ALL=true
          fi

          # Find which specific .qmd slide files changed (relative path, no extension)
          CHANGED=""
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- 'cyberboswachters/slides/' \
              | grep '\.qmd$' \
              | sed -E 's|^cyberboswachters/slides/||; s|\.qmd$||')
          fi
          echo "Changed slides:"
          echo "$CHANGED"

          # Collect slides that need PDF (re)generation (recursive, supports en/ etc.)
          TO_CONVERT=""
          while IFS= read -r f; do
            rel=${f#cyberboswachters/build/slides/}
            name=${rel%.html}
            base=$(basename "$name")
            [ "$base" = "index" ] && continue
            pdf="cyberboswachters/build/slides/${name}.pdf"
            if [ "$REBUILD_ALL" = "true" ] || [ ! -f "$pdf" ] || echo "$CHANGED" | grep -Fxq "$name"; then
              TO_CONVERT="$TO_CONVERT $name"
            fi
          done < <(find cyberboswachters/build/slides -type f -name '*.html')

          if [ -z "$TO_CONVERT" ]; then
            echo "All slide PDFs are up to date"
          else
            npm install -g decktape
            for name in $TO_CONVERT; do
              echo "Converting $name to PDF..."
              decktape reveal "file://$(pwd)/cyberboswachters/build/slides/${name}.html" \
                "cyberboswachters/build/slides/${name}.pdf" \
                --size 1920x1080 --chrome-arg=--no-sandbox || true
            done
          fi

          # Update cache directory (preserve subfolder structure)
          mkdir -p cached-slide-pdfs
          rsync -a --include='*/' --include='*.pdf' --exclude='*' \
            cyberboswachters/build/slides/ cached-slide-pdfs/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cyberboswachters/build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4