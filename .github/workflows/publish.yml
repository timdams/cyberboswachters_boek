name: Build and Publish Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: pandoc/extra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache python3 py3-pip bash
          pip install pandoc-latex-environment mkdocs mkdocs-material --break-system-packages

      - name: Build PDF
        run: |
          bash Manuscript/build.sh

      - name: Build Website
        run: |
          python3 Manuscript/generate_site.py
          cp Manuscript/book.pdf site/book.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
