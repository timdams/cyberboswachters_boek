name: Build and Publish Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto book
        run: quarto render cyberboswachters/

      - name: Render slides
        run: quarto render cyberboswachters/slides/

      - name: Install decktape
        run: npm install -g decktape

      - name: Convert slides to PDF
        run: |
          for f in cyberboswachters/build/slides/*.html; do
            filename=$(basename "$f" .html)
            if [ "$filename" != "index" ]; then
              decktape reveal "file://$(pwd)/$f" "cyberboswachters/build/slides/${filename}.pdf" --size 1920x1080 || true
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cyberboswachters/build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4